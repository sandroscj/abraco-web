<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABRAÇO • Nova Campanha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo-area" href="home.html">
      <span class="logo-caixa">ABRAÇO</span>
      <span class="logo-texto">Rede Solidária</span>
    </a>
    <nav class="menu-links" id="menu-principal" aria-label="Navegação principal"></nav>
    <div class="menu-botoes" id="botoes-usuario"></div>
  </header>

  <main class="layout-painel">
    <aside class="sidebar">
      <div>
        <div class="titulo-destaque" style="font-size:20px;">ABRAÇO ENTIDADE</div>
        <div style="color:#F29985; font-size:13px; font-weight:700;">Abrigo Esperança</div>
        <div class="sidebar-lista">
          <a class="sidebar-item" href="ong-dashboard.html">Necessidades (CRUD)</a>
          <a class="sidebar-item ativo" href="ong-nova.html">Nova Campanha</a>
          <a class="sidebar-item" href="mensagens.html">Mensagens</a>
        </div>
      </div>
      <button class="botao-sair-sidebar" onclick="fazerLogout()">⎋ Sair da conta</button>
    </aside>

    <section class="conteudo-painel">
      <a style="color:#8C5535; font-weight:700; font-size:14px;" href="ong-dashboard.html">← Voltar ao Painel</a>
      <h1 class="titulo-destaque" style="font-size:28px; margin:10px 0 22px;">Divulgar Nova Campanha</h1>

      <div class="card">
        <div class="grade-2">
          <div class="campo-form">
            <label for="nova-titulo">Título da Campanha</label>
            <input id="nova-titulo" class="input-texto" type="text" placeholder="Ex: Campanha de Inverno 2026" />
          </div>
          <div class="campo-form">
            <label for="nova-categoria">Categoria</label>
            <select id="nova-categoria" class="input-texto">
              <option value="Roupas">Roupas</option>
              <option value="Alimentos">Alimentos</option>
              <option value="Material Escolar">Material Escolar</option>
              <option value="Emergência">Emergência</option>
            </select>
          </div>
        </div>
        <div class="campo-form">
          <label for="nova-item">Primeiro Item Necessário</label>
          <input id="nova-item" class="input-texto" type="text" placeholder="Ex: Casaco tamanho 8 anos" />
        </div>
        <div class="campo-form" style="max-width:160px;">
          <label for="nova-qtd">Quantidade</label>
          <input id="nova-qtd" class="input-texto" type="number" min="1" value="5" />
        </div>
        <button class="botao botao-primario botao-grande" onclick="publicarCampanha()">Publicar Campanha</button>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="rodape-base">© 2026 ABRAÇO Rede Solidária • Projeto Interdisciplinar de Desenvolvimento Web</div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
