<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABRAÇO • Buscar Campanhas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo-area" href="home.html">
      <span class="logo-caixa">ABRAÇO</span>
      <span class="logo-texto">Rede Solidária</span>
    </a>
    <nav class="menu-links" id="menu-principal" aria-label="Navegação principal"></nav>
    <div class="menu-botoes" id="botoes-usuario"></div>
  </header>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
      <div class="barra-busca" style="max-width:740px;">
        <span aria-hidden="true">🔍</span>
        <input id="campo-busca-lista" type="text" aria-label="Pesquisar entidade ou item" placeholder="Procurar entidade, item ou campanha emergencial..." oninput="desenharBusca()" />
        <button class="botao botao-primario botao-pequeno" onclick="desenharBusca()">Buscar</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="btn-modo-lista" class="botao botao-primario" onclick="mudarModoBusca('lista')">☰ Lista</button>
        <button id="btn-modo-mapa" class="botao botao-claro" onclick="mudarModoBusca('mapa')">🗺 Mapa</button>
      </div>
    </div>

    <div class="layout-busca">
      <aside class="card">
        <h1 class="titulo-destaque" style="font-size:20px;">Filtros</h1>
        <div class="grupo-filtro">
          <h4>Categoria</h4>
          <label class="opcao-filtro"><input type="radio" name="filtro-cat" value="Todas" checked onchange="desenharBusca()" /> Todas</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-cat" value="Roupas" onchange="desenharBusca()" /> Roupas</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-cat" value="Alimentos" onchange="desenharBusca()" /> Alimentos</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-cat" value="Material Escolar" onchange="desenharBusca()" /> Material Escolar</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-cat" value="Emergência" onchange="desenharBusca()" /> Emergência</label>
        </div>
        <div class="grupo-filtro">
          <h4>Urgência</h4>
          <label class="opcao-filtro"><input type="radio" name="filtro-urg" value="Todas" checked onchange="desenharBusca()" /> Todas</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-urg" value="Alta" onchange="desenharBusca()" /> Alta</label>
          <label class="opcao-filtro"><input type="radio" name="filtro-urg" value="Média" onchange="desenharBusca()" /> Média</label>
        </div>
      </aside>

      <div id="resultado-busca-lista"></div>

      <div id="resultado-busca-mapa" class="mapa-simulado" style="display:none;">
        <button class="pino-mapa" style="top:20%; left:18%;" onclick="abrirCampanha(1)">📍 Abrigo Esperança (Centro)</button>
        <button class="pino-mapa" style="top:48%; left:50%;" onclick="abrirCampanha(2)">📍 Casa da Criança (Jardim Camburi)</button>
        <button class="pino-mapa" style="top:72%; left:26%;" onclick="abrirCampanha(3)">📍 Lar Semente Você (Laranjeiras)</button>
        <span style="color:#6B5E58; font-weight:700;">Mapa de pontos de coleta — clique em um marcador</span>
      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="rodape-base">© 2026 ABRAÇO Rede Solidária • Projeto Interdisciplinar de Desenvolvimento Web</div>
  </footer>
  <script src="../app.js"></script>
</body>
</html>
